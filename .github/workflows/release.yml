# Windows 用の .exe を作って Releases に置きます。動くきっかけは次の3つです。
#   1. release-notes/ の中身を変えて main に送ったとき
#      → accent_app.py の VERSION（例: 0.2）から v0.2 のタグと Release を自動で作ります
#   2. v から始まるタグ（例: v0.3）を付けて送ったとき
#   3. Actions タブから手動で動かしたとき（公開はせず、成果物として zip を残すだけ）
# 版を上げる手順: accent_app.py の VERSION を上げる → release-notes/v<版>.md を書く → main に送る
name: Windows 版をビルドして公開

on:
  push:
    branches: [main]
    paths: ["release-notes/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"   # 日本語の出力で文字化け・エラーにならないように
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 版の名前を決める
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(python -c "import re;print(re.search(r'VERSION = \"(.+?)\"', open('accent_app.py', encoding='utf-8').read()).group(1))")"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "版: $TAG"

      - name: 必要なものを入れる
        run: pip install pyinstaller pillow

      - name: テスト（数字の展開と学習）
        shell: bash
        run: |
          python tests/test_samples.py
          python tests/test_accent_edit.py
          python tests/test_presets.py
          python tests/check_numbers.py > /dev/null

      - name: アイコンを用意する
        shell: bash
        run: |
          if [ -f assets/icon.png ]; then
            python tools/make_icon.py assets/icon.png build_icon.ico
            echo "ICON_ARGS=--icon build_icon.ico --add-data assets/icon.png;assets" >> "$GITHUB_ENV"
          else
            echo "assets/icon.png が無いので、アイコンなしで作ります"
          fi

      - name: .exe を作る
        shell: bash
        run: pyinstaller --noconfirm --onefile --windowed --name yukkuri-accent $ICON_ARGS accent_app.py

      - name: zip にまとめる
        shell: pwsh
        run: |
          $name = "yukkuri-accent-$env:TAG-windows"
          New-Item -ItemType Directory -Force "pkg/yukkuri-accent" | Out-Null
          Copy-Item dist/yukkuri-accent.exe pkg/yukkuri-accent/
          Copy-Item README.md, LICENSE pkg/yukkuri-accent/
          Copy-Item -Recurse dictionaries pkg/yukkuri-accent/
          Compress-Archive -Path pkg/yukkuri-accent -DestinationPath "$name.zip"
          "ZIP_NAME=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 成果物として残す
        uses: actions/upload-artifact@v4
        with:
          name: yukkuri-accent-windows
          path: ${{ env.ZIP_NAME }}

      - name: Releases に公開する
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ゆっくりアクセント辞書 ${{ env.TAG }}
          body_path: release-notes/${{ env.TAG }}.md
          files: ${{ env.ZIP_NAME }}
